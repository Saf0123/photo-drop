<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Drop</title>
<style>
  :root { --ink:#17212b; --paper:#e8eef2; --panel:#fff; --line:#9db0be; --accent:#0b6e8a; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink);
         font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; line-height:1.5; }
  main { width:min(520px,100%); }
  h1 { font-size:2.6rem; letter-spacing:-.03em; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:#46586a; }
  form { background:var(--panel); padding:24px; border-radius:6px; display:grid; gap:16px; }
  label.drop { display:grid; place-items:center; text-align:center; min-height:150px; padding:16px; cursor:pointer;
               border:2px dashed var(--line); border-radius:6px; }
  label.drop:hover, label.drop:focus-within, label.drop.over { border-color:var(--accent); background:#f1f8fa; }
  input[type=file] { position:absolute; opacity:0; width:1px; height:1px; }
  input[type=password] { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:4px; width:100%; }
  button { font:inherit; font-weight:600; padding:12px; border:0; border-radius:4px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #msg { min-height:1.5em; margin:0; font-size:.95rem; }
  #msg.err { color:var(--bad); }
  #result { display:none; margin-top:16px; background:var(--ink); color:#fff; padding:16px; border-radius:6px; }
  #result a { color:#bfe9f5; word-break:break-all; font-size:1.1rem; }
  #result small { display:block; margin-top:8px; color:#aab8c4; }
</style>
</head>
<body>
<main>
  <h1>Photo Drop</h1>
  <p class="sub">Upload an image and get a link. Links stop working after 30 days.</p>
  <form id="f">
    <label class="drop" id="drop"><span id="name">Drop an image here or click to choose<br><small>JPEG, PNG or WebP, up to 5 MB</small></span>
      <input type="file" name="file" id="file" accept="image/jpeg,image/png,image/webp" required></label>
    <input type="password" name="code" placeholder="Invite code" aria-label="Invite code" required autocomplete="off">
    <button id="go">Upload image</button>
    <p id="msg" role="status"></p>
  </form>
  <div id="result"><a id="link" href="#"></a><br><button id="copy" type="button" style="margin-top:12px;width:auto;padding:8px 14px">Copy link</button>
    <small id="exp"></small></div>
</main>
<script>
const $ = id => document.getElementById(id);
$("file").onchange = () => { $("name").textContent = $("file").files[0]?.name || "Choose an image"; };
["dragover","dragenter"].forEach(e => $("drop").addEventListener(e, ev => { ev.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(e => $("drop").addEventListener(e, () => $("drop").classList.remove("over")));
$("drop").addEventListener("drop", ev => { ev.preventDefault(); $("file").files = ev.dataTransfer.files; $("file").onchange(); });
$("f").onsubmit = async ev => {
  ev.preventDefault();
  $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "Uploading...";
  try {
    const r = await fetch("/upload", { method:"POST", body:new FormData($("f")) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Upload failed.");
    $("msg").textContent = "Uploaded.";
    $("link").href = $("link").textContent = j.url;
    $("exp").textContent = "Expires " + new Date(j.expires_at).toLocaleDateString();
    $("result").style.display = "block";
  } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; }
  $("go").disabled = false;
};
$("copy").onclick = async () => { await navigator.clipboard.writeText($("link").href); $("copy").textContent = "Copied"; };
</script>
</body>
</html>
